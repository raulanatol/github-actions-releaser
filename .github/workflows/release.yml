name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  pull-requests: read
  issues: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Github Actions Releaser
        id: actions_releaser
        uses: raulanatol/github-actions-releaser@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
