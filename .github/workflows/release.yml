name: Release
on:
  push:
    tags:
      # Only full versions. The moving major tag (v4, v5...) is re-pointed on every
      # release and must not create a release of its own.
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
  pull-requests: read
  issues: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Github Actions Releaser
        id: actions_releaser
        uses: raulanatol/github-actions-releaser@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
